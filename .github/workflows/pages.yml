name: Deploy Wave Inspector to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - 'assets/inspector.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build site artifact
        run: |
          mkdir -p _site/video
          cp assets/inspector.html _site/index.html
          curl -fSL -o _site/video/sdd-parallel-explainer-en.mp4 https://github.com/stopActingSoSmall/sdd-parallel/releases/download/v0.1.0/sdd-parallel-explainer-en.mp4
          curl -fSL -o _site/video/sdd-parallel-explainer-ru.mp4 https://github.com/stopActingSoSmall/sdd-parallel/releases/download/v0.1.0/sdd-parallel-explainer-ru.mp4
          curl -fSL -o _site/video/clip1-merge-bomb.mp4 https://github.com/stopActingSoSmall/sdd-parallel/releases/download/v0.1.0/clip1-merge-bomb.mp4
          curl -fSL -o _site/video/clip2-wave-plan.mp4 https://github.com/stopActingSoSmall/sdd-parallel/releases/download/v0.1.0/clip2-wave-plan.mp4
          curl -fSL -o _site/video/clip3-scope-guard.mp4 https://github.com/stopActingSoSmall/sdd-parallel/releases/download/v0.1.0/clip3-scope-guard.mp4
          curl -fSL -o _site/video/clip1-merge-bomb-ru.mp4 https://github.com/stopActingSoSmall/sdd-parallel/releases/download/v0.1.0/clip1-merge-bomb-ru.mp4
          curl -fSL -o _site/video/clip2-wave-plan-ru.mp4 https://github.com/stopActingSoSmall/sdd-parallel/releases/download/v0.1.0/clip2-wave-plan-ru.mp4
          curl -fSL -o _site/video/clip3-scope-guard-ru.mp4 https://github.com/stopActingSoSmall/sdd-parallel/releases/download/v0.1.0/clip3-scope-guard-ru.mp4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
