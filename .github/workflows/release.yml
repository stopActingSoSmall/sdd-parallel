name: Release & Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Distribution Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Build sdist and wheel
        run: uv build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI (Trusted Publishing OIDC)
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sdd-parallel
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    name: Create GitHub Release
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Extract release notes from CHANGELOG.md
        id: extract_notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'EOF'
          import os, re
          from pathlib import Path

          tag = os.environ["TAG_NAME"].lstrip("v")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(
              rf"^## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              re.MULTILINE | re.DOTALL,
          )
          match = pattern.search(changelog)
          body = match.group(1).strip() if match else ""
          if body:
              Path("dist_release_notes.md").write_text(body + "\n", encoding="utf-8")
              has_notes = "true"
          else:
              has_notes = "false"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"has_notes={has_notes}\n")
          EOF

      - name: Create GitHub Release (Curated CHANGELOG)
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') && steps.extract_notes.outputs.has_notes == 'true'
        with:
          files: dist/*
          body_path: dist_release_notes.md
          generate_release_notes: false

      - name: Create GitHub Release (Filtered PR Fallback)
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') && steps.extract_notes.outputs.has_notes != 'true'
        with:
          files: dist/*
          generate_release_notes: true
