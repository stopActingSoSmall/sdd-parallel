# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
tone_instructions: "Report ONLY Critical/High functional, security, or invariant bugs. Suppress Medium/Low nitpicks and theoretical edge cases when fail-closed guards exist."
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 1
    drafts: true
    base_branches:
      - "master"
  path_filters:
    - "!docs/assets/**"
    - "!docs/marketing/**"
    - "!docs/i18n/**"
    - "!assets/inspector.html"
    - "!**/*.gif"
    - "!**/*.mp4"
    - "!uv.lock"
    - "!.tmp/**"
    - "!.parallel/**"
  path_instructions:
    - path: "src/sdd_parallel/runner.py"
      instructions: |
        RETRO AUDIT LENS 5 (Subprocess Lifecycle, Deadlocks & CLI Contracts): Report ONLY Critical/High bugs causing zombie subprocesses on timeout, Windows stdout/stderr pipe deadlocks, violations of the Freeze Invariant on verdict.is_qualified, or incorrect CLI fail-closed exit codes.
    - path: "src/sdd_parallel/autopilot.py"
      instructions: |
        RETRO AUDIT LENS 5 (Subprocess Lifecycle, Deadlocks & CLI Contracts): Report ONLY Critical/High bugs causing zombie subprocesses on timeout, Windows stdout/stderr pipe deadlocks, violations of the Freeze Invariant on verdict.is_qualified, or incorrect CLI fail-closed exit codes.
    - path: "src/sdd_parallel/cli.py"
      instructions: |
        RETRO AUDIT LENS 5 (Subprocess Lifecycle, Deadlocks & CLI Contracts): Report ONLY Critical/High bugs causing zombie subprocesses on timeout, Windows stdout/stderr pipe deadlocks, violations of the Freeze Invariant on verdict.is_qualified, or incorrect CLI fail-closed exit codes.
    - path: "src/sdd_parallel/inspector.py"
      instructions: |
        RETRO AUDIT LENS 5 (Subprocess Lifecycle, Deadlocks & CLI Contracts): Report ONLY Critical/High bugs causing zombie subprocesses on timeout, Windows stdout/stderr pipe deadlocks, violations of the Freeze Invariant on verdict.is_qualified, or incorrect CLI fail-closed exit codes.
    - path: "src/sdd_parallel/**/*.py"
      instructions: |
        Enforce strict architectural invariants from AGENTS.md and ADR-0009:
        1. DETERMINISTIC CORE (ADR-0009): Reject any LLM API calls, USD pricing tables, or network telemetry clients inside the core package.
        2. PATH SANITIZATION: Flag any hardcoded local workstation paths (e.g., C:/Users/..., /Users/...).
        3. ANTI-OVERFITTING: Flag magic strings, hardcoded repo-specific filenames, or brittle heuristics tailored to a single demo repository.
        4. DO NOT comment on formatting, imports, or static typing — ruff and mypy --strict already enforce these in CI.
        5. DEFENSE-IN-DEPTH & FAIL-CLOSED BOUNDARY: When a static analysis or heuristic module (AST, regex, import graph, manifest parser) already implements a conservative fail-closed fallback or is backed by a downstream barrier gate (verify-wave, ast_diff_gate, checkpoint_gates, Partial Barrier Merge), DO NOT request support for rare dynamic language constructs (complex multiple-inheritance mixin MRO, dynamic getattr/globals dispatch, metaprogramming).
        6. ACTIONABILITY GATE: Flag only defects that cause false fail-open behavior on standard inputs, corrupt Git/worktree state, violate ADR-0009/ADR-0013 invariants, or break deterministic tests.
    - path: "src/sdd_parallel/{worktree.py,plugin_installer.py,hooks/**}"
      instructions: |
        Enforce Invariant 1 (Zero Worktree Pollution) and Blast-Radius Isolation:
        - Verify LIFO rollback guarantees on partial failures in WorktreeRollbackManager.
        - Ensure Git 2.48+ compatibility (useRelativePaths=false) is preserved.
        - Audit PreToolUse hooks and .parallel-lock.json enforcement for path traversal or silent fail-open behavior.
    - path: "src/sdd_parallel/adapters/**"
      instructions: |
        Enforce Read-Only ACL boundary: adapters must not mutate upstream SDD kit state outside the explicit monotonic 3-way status merger contract.
    - path: "src/sdd_parallel/{runner.py,autopilot.py}"
      instructions: |
        Enforce Depth-0 CLI Runner contract: reject Parent-Worker LLM polling loops, verify Freeze Invariant on verdict.is_qualified, and check subprocess cleanup.
  tools:
    ruff:
      enabled: false
    flake8:
      enabled: false
    pylint:
      enabled: false
    markdownlint:
      enabled: false
    yamllint:
      enabled: false
    gitleaks:
      enabled: true
    semgrep:
      enabled: true
    actionlint:
      enabled: true

knowledge_base:
  opt_out: false
  learnings:
    scope: "auto"
  code_guidelines:
    enabled: true
    filePatterns:
      - "ARCHITECTURE.md"
